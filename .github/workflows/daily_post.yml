name: Daily Tistory Post

on:
  schedule:
    # 매일 07:00 KST = 22:00 UTC (전일 기준)
    - cron: '0 22 * * *'
  workflow_dispatch:        # 수동 실행 버튼 노출

concurrency:
  group: daily-tistory-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # TISTORY_STATE_JSON 시크릿 → 프로젝트 루트의 state.json 파일로 기록.
      # printf 로 변수 치환 (heredoc 보다 특수문자에 안전).
      - name: Write Tistory storage_state
        env:
          TISTORY_STATE_JSON: ${{ secrets.TISTORY_STATE_JSON }}
        run: |
          if [ -z "$TISTORY_STATE_JSON" ]; then
            echo "::error::TISTORY_STATE_JSON secret is empty"
            exit 1
          fi
          printf '%s' "$TISTORY_STATE_JSON" > state.json
          echo "state.json bytes: $(wc -c < state.json)"

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          # GEMINI_MODEL:       ${{ secrets.GEMINI_MODEL }}   # 모델명 오버라이드 시
          TISTORY_STATE_PATH:   state.json
        run: python main.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tistory-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # 보안: 워크스페이스에 state.json 이 남지 않도록 명시적 삭제
      - name: Cleanup state.json
        if: always()
        run: rm -f state.json
