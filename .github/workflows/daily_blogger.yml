name: Daily Blogger Post

# Single track: Blogger v3 REST API only — no Playwright / storage_state.

on:
  schedule:
    # Daily at 02:00 UTC = 11:00 KST = 22:00 EST (prev day)
    # so the post is live for the US morning audience.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate only — do NOT publish (verify CI env safely)'
        type: boolean
        required: false
        default: false
      disable:
        description: 'Comma-separated blog slugs to skip this run (optional)'
        required: false
        default: ''

concurrency:
  group: daily-blogger-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 20 sites x (~15s work + 30s inter-site sleep) = ~14 min best case.
    # 45 min absorbs multiple 65s quota retries before GitHub auto-cancels.
    timeout-minutes: 70

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # No Playwright install step — Blogger v3 is a pure REST API.

      - name: Run blogger pipeline
        env:
          # --- AI (multi-key routing, GEMINI_API_KEY is the fallback) ---
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1:     ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2:     ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:     ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4:     ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5:     ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6:     ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7:     ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8:     ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9:     ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10:    ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_MODEL:       ${{ secrets.GEMINI_MODEL }}
          # --- Featured image (Hugging Face FLUX.1-schnell, free tier) ---
          HF_API_TOKEN:         ${{ secrets.HF_API_TOKEN }}
          # PAT (contents:write on advancedunolee/blog-assets) for hosting images.
          ASSETS_REPO_PAT:      ${{ secrets.ASSETS_REPO_PAT }}
          # --- Blogger OAuth ---
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # --- Run digest webhook (Discord/Slack-compatible; optional) ---
          RUN_WEBHOOK_URL:      ${{ secrets.RUN_WEBHOOK_URL }}
          # --- Search Console feedback (optional; needs webmasters.readonly
          #     scope. Falls back to GOOGLE_* above if these are unset) ---
          GSC_CLIENT_ID:        ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET:    ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN:    ${{ secrets.GSC_REFRESH_TOKEN }}
          # --- Skip specific blogs this run (manual dispatch input) ---
          BLOGKIT_DISABLE:      ${{ github.event.inputs.disable }}
        # Preflight first (fail fast on missing secrets), then run.
        # Use --group N to run only one batch (e.g., `python -m blogkit run --group 2`).
        # A manual dispatch with dry_run=true generates without publishing —
        # this verifies the full CI env (pip install -e ., doctor, package
        # import, generation) safely. Scheduled runs always publish for real.
        run: |
          python -m blogkit doctor
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry_run=true — generating without publishing"
            python -m blogkit run --dry-run
          else
            python -m blogkit run
          fi
