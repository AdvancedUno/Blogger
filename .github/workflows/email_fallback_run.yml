name: Email Fallback Publish

# Manual fallback for Blogger API 429 daily-quota days: generates posts and
# publishes them via Mail2Blogger (SMTP) instead of the Blogger v3 REST API.

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'run_group to publish (matches a profile run_group)'
        required: true
        default: '1'

concurrency:
  group: email-fallback-publish
  cancel-in-progress: false

jobs:
  publish-email:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write      # keyless GCP auth (Vertex image provider)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Authenticate to Google Cloud (keyless)
        if: ${{ vars.IMAGE_PROVIDER == 'vertex' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run blogger pipeline (email fallback)
        env:
          # --- Featured image generation (provider selected by IMAGE_PROVIDER) ---
          IMAGE_PROVIDER:       ${{ vars.IMAGE_PROVIDER }}
          HF_API_TOKEN:         ${{ secrets.HF_API_TOKEN }}
          GCP_PROJECT:          ${{ vars.GCP_PROJECT }}
          VERTEX_LOCATION:      ${{ vars.VERTEX_LOCATION }}
          VERTEX_IMAGE_MODEL:   ${{ vars.VERTEX_IMAGE_MODEL }}
          GCP_SA_KEY:           ${{ secrets.GCP_SA_KEY }}
          # PAT (contents:write on advancedunolee/blog-assets) for hosting images.
          ASSETS_REPO_PAT:      ${{ secrets.ASSETS_REPO_PAT }}
          # --- AI text generation (multi-key routing; GEMINI_API_KEY is the
          #     universal fallback). Any run_group spans 5 distinct per-blog keys,
          #     so all of them must be present or non-KEY_1 blogs fail generation. ---
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1:     ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2:     ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:     ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4:     ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5:     ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6:     ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7:     ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8:     ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9:     ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10:    ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_MODEL:         ${{ secrets.GEMINI_MODEL }}
          # --- Mail2Blogger SMTP publishing ---
          BLOGGER_SECRET_EMAIL: ${{ secrets.BLOGGER_SECRET_EMAIL }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}
          # --- Run digest webhook (Discord/Slack-compatible; optional) ---
          RUN_WEBHOOK_URL:      ${{ secrets.RUN_WEBHOOK_URL }}
        # Preflight first (fail fast on missing secrets), then the email run.
        run: |
          python -m blogkit doctor --publish-method email
          python -m blogkit run --group ${{ github.event.inputs.group }} --publish-method email
