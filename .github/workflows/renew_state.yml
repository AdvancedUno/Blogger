name: Renew Tistory State

# state.json (Tistory/Kakao 세션 쿠키) 을 주기적으로 새로 발급하여
# GitHub Secret TISTORY_STATE_JSON 을 자동 갱신한다.
# 이렇게 두면 daily_post 워크플로는 항상 신선한 state 로 시작되어
# SessionExpiredError 가 거의 발생하지 않는다.

on:
  schedule:
    # 매주 월요일 04:00 KST = 일요일 19:00 UTC
    - cron: '0 19 * * 0'
  workflow_dispatch:        # 수동 강제 갱신 버튼

permissions:
  contents: read
  # ⚠️ GITHUB_TOKEN 으로는 Secret 쓰기 불가. 아래 단계에서 GH_PAT 시크릿 사용.

concurrency:
  group: renew-tistory-state
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Kakao 자격증명으로 로그인 → state.json 생성
      - name: Run auto-login
        env:
          KAKAO_EMAIL:        ${{ secrets.KAKAO_EMAIL }}
          KAKAO_PASSWORD:     ${{ secrets.KAKAO_PASSWORD }}
          TISTORY_STATE_PATH: state.json
        run: python -m src.auto_login

      - name: Verify state.json non-empty
        run: |
          if [ ! -s state.json ]; then
            echo "::error::state.json missing or empty — auto-login failed"
            exit 1
          fi
          echo "state.json bytes: $(wc -c < state.json)"

      # gh CLI 로 Secret 업데이트.
      # GH_PAT : Personal Access Token (classic: repo, 또는 fine-grained: Secrets RW)
      # 토큰이 없으면 시크릿 업데이트는 건너뛰고 워크플로는 성공 처리.
      - name: Update TISTORY_STATE_JSON secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT not set — Secret 자동 갱신을 건너뜁니다. "
            echo "::warning::Secret 을 직접 갱신하려면 GH_PAT (repo scope) 시크릿을 등록하세요."
            exit 0
          fi
          gh secret set TISTORY_STATE_JSON --body-file state.json
          echo "::notice::Secret TISTORY_STATE_JSON updated successfully"

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tistory-renew-debug
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup state.json
        if: always()
        run: rm -f state.json
