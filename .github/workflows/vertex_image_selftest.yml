name: Vertex Image Selftest

# Manual, non-publishing check of the keyless Vertex AI Imagen path:
# GitHub OIDC -> Workload Identity Federation -> Imagen -> GitHub host -> jsDelivr.
# Generates ONE image and prints its CDN URL. Touches no blog.

on:
  workflow_dispatch:
    inputs:
      blog:
        description: "Blog slug to borrow its style pool (optional)"
        required: false
        default: ''

permissions:
  contents: read
  id-token: write      # required to mint the OIDC token for keyless GCP auth

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Generate one Imagen image (Vertex)
        env:
          IMAGE_PROVIDER:     vertex
          GCP_PROJECT:        ${{ vars.GCP_PROJECT }}
          VERTEX_LOCATION:    ${{ vars.VERTEX_LOCATION }}
          VERTEX_IMAGE_MODEL: ${{ vars.VERTEX_IMAGE_MODEL }}
          # Needed to host the generated PNG (contents:write on the assets repo).
          ASSETS_REPO_PAT:    ${{ secrets.ASSETS_REPO_PAT }}
        run: |
          if [ -n "${{ github.event.inputs.blog }}" ]; then
            python -m blogkit selftest-image --blog "${{ github.event.inputs.blog }}"
          else
            python -m blogkit selftest-image
          fi
