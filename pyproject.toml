[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blogkit"
version = "0.1.0"
description = "Automated multi-blog content pipeline (Gemini text + HF images + Blogger publishing), profile-driven per blog."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.0",
    "feedparser>=6.0.10",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "pydantic>=2.5",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
blogkit = "blogkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["blogkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# The system/user prompt templates are long literal text by nature.
"blogkit/core/generator.py" = ["E501"]
# One-off data generator: long persona/brief literals by nature.
"tools/generate_new_profiles.py" = ["E501"]
# AdSense page templates are long literal HTML paragraphs by nature.
"setup_pages.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
