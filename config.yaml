# =====================================================================
# 다중 블로그 운영 설정 (Multi-Blog Profile Config)
# =====================================================================
# 인증은 storage_state(state.json) 주입으로 처리합니다.
#   - 로컬: 프로젝트 루트에 state.json 파일 배치 (.gitignore 처리됨)
#   - CI:   TISTORY_STATE_JSON Secret → workflow 단계에서 state.json 으로 기록
#
# state.json 경로를 바꾸려면 환경변수 TISTORY_STATE_PATH 로 오버라이드.
# =====================================================================

defaults:
  max_news_items: 6
  headless: true

blogs:
  - name: "Tech Blog"
    blog_name: "unobigtech"           
    niche_keyword: "technology"
    rss_query: "B2B SaaS OR 클라우드 보안 OR AI 인프라 OR 데이터센터 OR 엔터프라이즈 솔루션"
    topic_label: "IT/테크"
    tags: ["IT", "테크", "AI", "기술트렌드", "스타트업"]

  - name: "Economy Blog"
    blog_name: "unoecon"
    niche_keyword: "finance"
    rss_query: "미국 배당 ETF OR 부동산 대출 OR 연금저축펀드 OR 금리인하 수혜주 OR 보험 리모델링"
    topic_label: "경제/투자"
    tags: ["경제", "주식", "투자", "재테크", "금융"]

  - name: "Health Blog"
    blog_name: "unohealth"           
    niche_keyword: "health"
    rss_query: "임플란트 가격 OR 비만 치료제 OR 항노화 영양제 OR 혈당 관리 OR 실손 보험 리모델링"
    topic_label: "건강/의료"
    tags: ["건강", "의료", "영양제", "보험", "혈당관리"]

  - name: "Real Estate Blog"
    blog_name: "unohouse"       
    niche_keyword: "realestate"
    rss_query: "아파트 청약 OR 주택담보대출 OR 디딤돌 대출 조건 OR 부동산 세금 OR 청년 정부지원금"
    topic_label: "부동산/정부지원"
    tags: ["부동산", "청약", "주담대", "디딤돌대출", "정부지원금"]

  - name: "Side Hustle Blog"
    blog_name: "unohustle"       
    niche_keyword: "business"
    rss_query: "직장인 투잡 OR 1인 창업 OR 정부지원 사업 OR 유망 자격증 추천 OR 무자본 수익화"
    topic_label: "부업/커리어"
    tags: ["부업", "투잡", "1인창업", "자격증", "정부지원사업"]
