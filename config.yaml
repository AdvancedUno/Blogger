# =====================================================================
# Multi-Blog Profile Config (Blogger / English market)
# =====================================================================
#
# Keyword Roulette:
#   rss_queries is a list. The fetcher / fallback loop in main_blogger.py
#   shuffles the list and tries keywords sequentially until news is found.
#
# Multi-API Key Routing:
#   Each site declares an api_key_env naming the Gemini API key env var.
#   main_blogger.py reads os.environ[api_key_env] and passes it through to
#   generate_post(api_key=...). run_group lets you batch-chunk runs via
#   `python main_blogger.py --group N`.
# =====================================================================

defaults:
  max_news_items: 6
  # Featured image: OFF by default = text-only posts (light, AdSense-friendly,
  # no external image dependency). Set to true here to enable for ALL blogs,
  # or add `featured_image: true` under an individual site to enable just one.
  # When on, main_blogger.py generates a unique pollinations.ai image per post,
  # downloads it at publish time, and inlines it as base64 (no live external
  # image links). Any failure falls back to text-only automatically.
  featured_image: true


