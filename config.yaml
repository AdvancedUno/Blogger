# =====================================================================
# 다중 블로그 운영 설정 (Multi-Blog Profile Config)
# =====================================================================
# 인증은 storage_state(state.json) 주입으로 처리합니다.
#   - 로컬: 프로젝트 루트에 state.json 파일 배치 (.gitignore 처리됨)
#   - CI:   TISTORY_STATE_JSON Secret → workflow 단계에서 state.json 으로 기록
#
# state.json 경로를 바꾸려면 환경변수 TISTORY_STATE_PATH 로 오버라이드.
#
# Keyword Roulette: rss_queries 는 리스트로 정의하고, fetcher 가 실행 시
# random.choice 로 단 하나의 키워드만 골라 Google News RSS 에 사용.
# OR 체인 시 검색량 높은 토픽으로 결과가 쏠리는 문제를 회피.
# =====================================================================

defaults:
  max_news_items: 6
  headless: true

blogs:
  - name: "Tech Blog"
    blog_name: "unobigtech"
    niche_keyword: "technology"
    rss_queries:
      - "B2B SaaS"
      - "클라우드 보안"
      - "AI 인프라"
      - "데이터센터"
      - "엔터프라이즈 솔루션"
      - "자율주행"
      - "로봇공학"
      - "양자컴퓨터"
      - "시스템 반도체"
      - "핀테크"
    topic_label: "IT/테크"
    tags: ["IT", "테크", "AI", "기술트렌드", "스타트업"]

  - name: "Economy Blog"
    blog_name: "unoecon"
    niche_keyword: "finance"
    rss_queries:
      - "미국 배당 ETF"
      - "연금저축펀드"
      - "금리인하 수혜주"
      - "채권 투자"
      - "환율 전망"
      - "원자재 시세"
      - "글로벌 매크로"
      - "IPO 공모주"
      - "리츠 투자"
      - "배당주"
    topic_label: "경제/투자"
    tags: ["경제", "주식", "투자", "재테크", "금융"]

  - name: "Health Blog"
    blog_name: "unohealth"
    niche_keyword: "health"
    rss_queries:
      - "임플란트"
      - "비만치료제"
      - "영양제"
      - "당뇨 관리"
      - "실손보험"
      - "탈모 치료"
      - "안티에이징"
      - "치매 예방"
      - "디지털 헬스케어"
      - "헬스케어 AI"
    topic_label: "건강/의료"
    tags: ["건강", "의료", "영양제", "보험", "혈당관리"]

  - name: "Real Estate Blog"
    blog_name: "unohouse"
    niche_keyword: "realestate"
    rss_queries:
      - "아파트 청약"
      - "주택담보대출"
      - "전세사기"
      - "디딤돌대출"
      - "재건축"
      - "신도시 발표"
      - "상가 투자"
      - "법원 경매"
      - "청년주택"
      - "GTX 개통"
    topic_label: "부동산/정부지원"
    tags: ["부동산", "청약", "주담대", "디딤돌대출", "정부지원금"]

  - name: "Side Hustle Blog"
    blog_name: "unohustle"
    niche_keyword: "business"
    rss_queries:
      - "스마트스토어"
      - "크몽 프리랜서"
      - "블로그 수익화"
      - "N잡러"
      - "국가공인자격증"
      - "유튜브 수익"
      - "인스타 공구"
      - "전자책 출판"
      - "이모티콘 작가"
      - "무인점포"
    topic_label: "부업/커리어"
    tags: ["부업", "투잡", "1인창업", "자격증", "정부지원사업"]
